[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{font-family:var(--f-body);font-size:15px;line-height:1.6;color:var(--ink);background:var(--steel);
  background-image:repeating-linear-gradient(90deg,var(--stripe) 0 1px,transparent 1px 3px),linear-gradient(180deg,var(--steel) 0%,var(--steel-2) 100%);
  background-attachment:fixed;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--signal-strong)}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:600;margin:0;line-height:1.3;text-wrap:balance}
h1{font-size:24px}h2{font-size:19px}h3{font-size:16px}
:is(h1,h2,h3,h4):not(.page *){word-spacing:.16em}
p{margin:0}
.num,.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
div.ltr{display:block;text-align:start}
:focus-visible{outline:2.5px solid var(--signal);outline-offset:2px;border-radius:6px}
svg.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
html[lang="en"] body{font-size:14.5px}

/* ---------- Shell ---------- */
#app{min-height:100%}
.topbar{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,#232930,#1A1E23);color:#EEF1F4;border-bottom:1px solid #0E1114;box-shadow:inset 0 -1px 0 rgba(255,255,255,.05);padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top))}
:root[data-scheme="dark"] .topbar{background:linear-gradient(180deg,#14181D,#0B0E11);border-bottom-color:#20262D}
.topbar-in{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg.logo{width:46px;height:38px;flex:none}
.brand-t{display:flex;flex-direction:column;line-height:1.15}
.brand-t b{font-family:"Chakra Petch",var(--f-body);font-weight:600;font-size:18px;letter-spacing:.3px;direction:ltr;text-align:start}
.brand-t small{font-size:11.5px;color:#9EA8B3}
.top-actions{margin-inline-start:auto;display:flex;gap:6px;align-items:center}
.tbtn{position:relative;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1px solid #39414B;background:#262C33;color:#E7EBEF;cursor:pointer}
.tbtn:hover{background:#2E353D}
.tbtn .dot{position:absolute;top:-3px;inset-inline-end:-3px;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--signal);color:var(--on-signal);font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid #1D2228}
.who{display:flex;align-items:center;gap:8px;padding:4px;padding-inline-start:12px;border-radius:999px;border:1px solid #39414B;background:#262C33;cursor:pointer;color:#E7EBEF}
.who .av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--on-signal);background:var(--led);font-style:normal}
.who .av svg{width:17px;height:17px}
.who span{font-size:13px;max-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:420px){.who span{display:none}.who{padding-inline-start:4px}}
.layout{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:1fr}
.side{display:none}
main.view{padding:16px 16px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom));min-width:0}
@media (min-width:960px){
  .layout{grid-template-columns:250px 1fr}
  .side{display:block;position:sticky;top:61px;height:calc(100vh - 61px);overflow:auto;padding:16px 12px 24px;border-inline-end:1px solid var(--line)}
  main.view{padding:22px 26px 40px}.bottomnav{display:none!important}
}
.side h6{font:600 12px var(--f-body);color:var(--ink-3);margin:16px 10px 6px}
.side a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;color:var(--ink-2);text-decoration:none;font-size:14px;cursor:pointer}
.side a:hover{background:var(--hover);color:var(--ink)}
.side a.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-weight:600}
.side a.on svg{color:var(--signal)}
.side a .cnt{margin-inline-start:auto;font-size:12px;background:var(--signal-soft);color:var(--signal-strong);border-radius:999px;padding:0 8px}
.bottomnav{position:fixed;bottom:0;inset-inline:0;z-index:30;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--nav-bg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr)}
.bottomnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;color:var(--ink-3);cursor:pointer;position:relative}
.bottomnav button.on{color:var(--ink);font-weight:600}
.bottomnav button.on::before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--signal)}
.bottomnav button.on svg{color:var(--signal)}
.bottomnav .cnt{position:absolute;top:6px;inset-inline-start:calc(50% + 6px);min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--crit);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:2px 0 16px}
.ph h1{font-size:23px}.ph p{color:var(--ink-2);font-size:13.5px;margin-top:2px}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--ink-2);font-size:13px;border:0;background:none;padding:0;margin-bottom:6px;cursor:pointer}
.nav-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.nav-row h2{min-width:120px;text-align:center}
.nav-row select.in{width:auto;max-width:100%;height:38px}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:42px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--line-strong)}
.btn.pri{background:linear-gradient(180deg,#F59331,#E57A0E);border-color:#C96A0B;color:var(--on-signal);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 12px -6px rgba(201,106,11,.8)}
.btn.pri:hover{filter:brightness(1.04)}
.btn.dark{background:var(--cab);border-color:var(--cab-line);color:#F2F4F6}
:root[data-scheme="dark"] .btn.dark{background:#2A323B;border-color:#3A444F}
.btn.ok{background:#157A3C;border-color:#0F5E2D;color:#fff}
.btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 35%,transparent);background:var(--surface)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.sm{height:34px;padding:0 12px;font-size:13px}.btn.xs{height:28px;padding:0 10px;font-size:12px}.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.wa{background:var(--surface);border-color:color-mix(in srgb,var(--ok) 40%,transparent);color:var(--ok)}
.ibtn{width:38px;height:38px;border-radius:50%;display:inline-grid;place-items:center;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--ink-2);text-decoration:none;flex:none}
.ibtn:hover{color:var(--ink)}
.ibtn.call{border-color:color-mix(in srgb,var(--ok) 40%,transparent);color:var(--ok);background:var(--ok-soft)}
.ibtn.route{border-color:color-mix(in srgb,var(--info) 40%,transparent);color:var(--info);background:var(--info-soft)}
.ibtn.wa{border-color:color-mix(in srgb,var(--ok) 40%,transparent);color:var(--ok);background:var(--surface)}
.fab{position:fixed;inset-inline-start:18px;bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom));z-index:29;width:60px;height:60px;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;color:var(--on-signal);background:radial-gradient(circle at 50% 35%,#FFB866,#EF8418 60%,#C96A0B);box-shadow:0 0 0 5px var(--fab-ring),0 0 0 6px var(--fab-ring-2),0 10px 22px -6px rgba(0,0,0,.45)}
.fab svg{width:26px;height:26px;stroke-width:2.2}
@media (min-width:960px){.fab{bottom:28px;inset-inline-start:auto;inset-inline-end:28px}}
.seg2{display:inline-flex;align-items:center;gap:4px;padding:3px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line)}
.seg2>svg{margin-inline:6px 2px;color:var(--ink-3)}
.seg2 button{height:32px;padding:0 12px;border-radius:999px;border:0;background:none;color:var(--ink-2);font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.seg2 button.on{background:var(--cab);color:#fff}
:root[data-scheme="dark"] .seg2 button.on{background:var(--signal);color:var(--on-signal)}
.seg2 button svg{width:16px;height:16px}
.pref-row{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- Surfaces ---------- */
.card{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.card.pad{padding:16px}
.sec{margin-bottom:18px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 2px 10px;flex-wrap:wrap}
.sec-h h2{font-size:17px}.sec-h .meta{font-size:12.5px;color:var(--ink-3)}
.grid{display:grid;gap:14px}
.grid>*{min-width:0}
@media (min-width:720px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}}
@media (min-width:1100px){.g2-wide{grid-template-columns:1.35fr 1fr}}
.muted{color:var(--ink-2)}.faint{color:var(--ink-3);font-size:12.5px}
.row{display:flex;align-items:center;gap:10px}.wrap{flex-wrap:wrap}.sp{flex:1}.grow{flex:1;min-width:0}
.ok-t{color:var(--ok);display:inline-flex;align-items:center;gap:4px;font-weight:600}
.ok-t svg{width:16px;height:16px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line-2);cursor:pointer;background:none;border-inline:0;border-bottom:0;text-align:start;width:100%;color:inherit}
.li:first-child{border-top:0}
.li:hover{background:var(--surface-2)}
.li.unread{background:var(--signal-soft)}
.li .t{font-weight:600;font-size:14.5px}.li .s{font-size:12.5px;color:var(--ink-2);margin-top:1px}
.li .grow{flex:1;min-width:0}
.li .end,.task-top .end{display:flex;flex-direction:column;align-items:flex-end;gap:4px;text-align:end}
.li .chev{color:var(--ink-3)}
.lead-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line-2);color:var(--ink-2);flex:none}
.lead-ic.hol{color:var(--holi);background:var(--holi-soft);border-color:transparent}
.stripe{width:4px;align-self:stretch;border-radius:3px;background:var(--line);flex:none}
.stripe.ok{background:var(--ok)}.stripe.warn{background:#E19A2B}.stripe.crit{background:var(--crit)}.stripe.info{background:var(--info)}.stripe.sig{background:var(--signal)}
.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line-2);vertical-align:middle}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.nod::before{display:none}
.pill svg{width:14px;height:14px}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 25%,transparent)}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 25%,transparent)}
.pill.crit{background:var(--crit-soft);color:var(--crit);border-color:color-mix(in srgb,var(--crit) 25%,transparent)}
.pill.info{background:var(--info-soft);color:var(--info);border-color:color-mix(in srgb,var(--info) 25%,transparent)}
.pill.sig{background:var(--signal-soft);color:var(--signal-strong);border-color:color-mix(in srgb,var(--signal) 30%,transparent)}
.pill.holi{background:var(--holi-soft);color:var(--holi);border-color:color-mix(in srgb,var(--holi) 25%,transparent)}
.pill.dark{background:var(--cab);color:#E7EBEF;border-color:var(--cab)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px}
.kv dt{color:var(--ink-3)}.kv dd{margin:0;font-weight:500}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px;min-width:560px}
.tbl th{font-weight:600;color:var(--ink-3);font-size:12px;text-align:start;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--surface-2)}

/* ---------- Floor-indicator tiles ---------- */
.indicators{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
@media (min-width:860px){.indicators{grid-template-columns:repeat(4,1fr)}}
.ind{position:relative;border-radius:14px;padding:12px 14px;color:#C9D0D7;cursor:pointer;border:1px solid var(--cab-line);background:linear-gradient(180deg,var(--cab-a),var(--cab-b));box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 8px 18px -12px rgba(0,0,0,.6);text-align:start;font:inherit}
.ind .lbl{font-size:12.5px;display:flex;align-items:center;gap:6px}
.ind .digits{font-family:var(--f-led);font-weight:600;font-size:34px;line-height:1.05;color:var(--led);text-shadow:0 0 14px rgba(255,163,50,.45);margin-top:6px;direction:ltr;text-align:end}
.ind .digits small{font-size:17px;color:#B9852F;text-shadow:none;margin-inline-start:2px}
.ind .sub{font-size:11.5px;color:#8E98A3;margin-top:2px}
.ind .floors{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.ind .floors i{width:9px;height:9px;border-radius:50%;background:#39414A;box-shadow:inset 0 0 0 1px #4A535D}
.ind .floors i.lit{background:var(--led);box-shadow:0 0 8px rgba(255,163,50,.7)}
.ind .floors i.late{background:#E0574F;box-shadow:0 0 8px rgba(224,87,79,.6)}
.ind.alert .digits{color:#FF7A6E;text-shadow:0 0 14px rgba(255,90,80,.45)}
.bar{height:8px;border-radius:999px;background:var(--line-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--signal)}
.bar.ok>i{background:var(--ok)}

/* building status board */
.bboard{display:grid;grid-auto-flow:column;grid-auto-columns:150px;gap:10px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:thin}
.bcard{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-md);box-shadow:var(--shadow);padding:10px;display:grid;justify-items:center;gap:4px;cursor:pointer;text-align:center;font:inherit;color:inherit}
.bcard{min-width:0}.bcard b{font-size:13px;line-height:1.3;display:block;width:100%;overflow-wrap:anywhere}.bcard small{color:var(--ink-3);font-size:11.5px}
.shafts{width:116px;height:104px}
.shafts .shaft{fill:var(--shaft-bg);stroke:var(--shaft);stroke-width:1.2}
.shafts .fl{stroke:var(--shaft);stroke-width:.6;opacity:.7}
.shafts .ground{stroke:var(--ink-3);stroke-width:1.2}
.shafts .car{stroke:none}
.shafts .car.ok{fill:var(--ok)}.shafts .car.info{fill:var(--info)}.shafts .car.sig{fill:var(--signal)}.shafts .car.crit{fill:var(--crit)}

/* steps */
.steps{display:flex;margin:4px 0 2px}
.step{flex:1;min-width:0;text-align:center;font-size:11px;line-height:1.35;padding-inline:2px;color:var(--ink-3);position:relative;padding-top:24px}
.step::before{content:"";position:absolute;top:7px;inset-inline-start:calc(50% - 7px);width:14px;height:14px;border-radius:50%;background:var(--surface);border:2px solid var(--line)}
.step::after{content:"";position:absolute;top:13px;inset-inline-start:calc(50% + 9px);width:calc(100% - 18px);height:2px;background:var(--line)}
.step:last-child::after{display:none}
.step.done{color:var(--ink-2)}.step.done::before{background:var(--signal);border-color:var(--signal)}.step.done::after{background:var(--signal)}
.step.cur{color:var(--ink);font-weight:700}.step.cur::before{border-color:var(--signal);box-shadow:0 0 0 4px var(--signal-soft)}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:12px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;color:var(--ink-2);white-space:nowrap;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.seg button b{font-weight:600;font-size:11.5px;background:var(--surface-2);border-radius:999px;padding:0 7px;color:var(--ink-2)}
.seg button.on{background:var(--cab);border-color:var(--cab);color:#fff}
:root[data-scheme="dark"] .seg button.on{background:var(--signal);border-color:var(--signal);color:var(--on-signal)}
.seg button.on b{background:rgba(255,255,255,.2);color:inherit}
.search{display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);margin-bottom:12px}
.search input{border:0;outline:0;background:none;flex:1;min-width:0;height:100%}
.search svg{color:var(--ink-3)}

/* ---------- Forms ---------- */
.form{display:grid;gap:12px}.f{display:grid;gap:5px}
.f label{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.f .hint{font-size:11.5px;color:var(--ink-3)}
.in,select.in,textarea.in{width:100%;height:44px;padding:0 12px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface-2);outline:0;color:var(--ink)}
textarea.in{height:auto;min-height:88px;padding:10px 12px;resize:vertical}
.in:focus{border-color:var(--signal);background:var(--surface);box-shadow:0 0 0 3px var(--signal-soft)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chk{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface-2);cursor:pointer;font-size:14px}
.chk input{width:18px;height:18px;accent-color:var(--signal)}
.chk.confirm{border-color:color-mix(in srgb,var(--signal) 40%,transparent);background:var(--signal-soft)}
.chks{display:grid;gap:6px}
.chip-chk{display:inline-flex}.chip-chk input{position:absolute;opacity:0}
.chip-chk span{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;display:inline-flex;align-items:center;cursor:pointer}
.chip-chk input:checked+span{background:var(--holi-soft);border-color:var(--holi);color:var(--holi);font-weight:600}
.chip-chk input:focus-visible+span{outline:2.5px solid var(--signal)}
.switch{position:relative;width:46px;height:28px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--switch-off);transition:.2s;cursor:pointer}
.switch span::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.switch input:checked+span{background:var(--signal)}
.switch input:checked+span::after{inset-inline-start:21px}
.set-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line-2)}
.set-row:first-child{border-top:0}
.set-row b{font-weight:600;font-size:14px;display:block}.set-row small{color:var(--ink-3);font-size:12px}
.sig-prev{width:110px;height:76px;border:1px dashed var(--line);border-radius:10px;display:grid;place-items:center;background:#fff;overflow:hidden;flex:none}
.sig-prev img{max-width:100%;max-height:100%}

/* ---------- Modal ---------- */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(10,12,15,.55);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:up .22s ease;padding-bottom:env(safe-area-inset-bottom);border:1px solid var(--line-2)}
.sheet.wide{max-width:900px}
.sheet-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line-2)}
.sheet-h h3{font-size:17px;flex:1}
.sheet-b{padding:16px;overflow:auto}
.sheet-f{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line-2);background:var(--surface-2);border-radius:0 0 20px 20px;flex-wrap:wrap}
.sheet-f .btn{flex:1}
@media (min-width:720px){.scrim{align-items:center;padding:20px}.sheet{border-radius:20px}}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
#toasts{position:fixed;z-index:80;top:calc(70px + env(safe-area-inset-top));inset-inline:0;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{pointer-events:auto;max-width:520px;width:100%;background:#1D2228;color:#F2F4F6;border:1px solid #333C46;border-radius:14px;padding:11px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 12px 28px -12px rgba(0,0,0,.6);font-size:14px;animation:up .2s ease}
.toast svg{color:var(--led)}.toast.ok svg{color:#5BD08A}.toast.err svg{color:#FF7A6E}
.banner{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:var(--r-md);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);background:var(--warn-soft);margin-bottom:12px;flex-wrap:wrap}
.banner .grow{min-width:200px}.banner b{display:block;font-size:14px}.banner small{color:var(--ink-2);font-size:12.5px}
.banner.info{border-color:color-mix(in srgb,var(--info) 30%,transparent);background:var(--info-soft)}
.banner.crit{border-color:color-mix(in srgb,var(--crit) 30%,transparent);background:var(--crit-soft)}
.act-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line-2)}
.act-item:first-child{border-top:0}
.act-item .grow{min-width:0}.act-item .t{font-weight:600;font-size:14px}.act-item .s{font-size:12.5px;color:var(--ink-2)}
.act-ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:700}
.act-ic.crit{background:var(--crit-soft);color:var(--crit)}.act-ic.warn{background:var(--warn-soft);color:var(--warn)}.act-ic.info{background:var(--info-soft);color:var(--info)}.act-ic.ok{background:var(--ok-soft);color:var(--ok)}.act-ic.sig{background:var(--signal-soft);color:var(--signal-strong)}
.empty{padding:28px 16px;text-align:center;color:var(--ink-2)}
.empty svg{width:34px;height:34px;color:var(--ink-3);margin-bottom:6px}
.empty b{display:block;color:var(--ink);margin-bottom:2px}

/* tasks */
.task{padding:14px;display:grid;gap:10px}
.task-top{display:flex;align-items:flex-start;gap:10px}
.task-top h3{font-size:16px}
.task .meta{display:grid;gap:6px;font-size:13.5px}
.task .meta .row{gap:8px}.task .meta svg{color:var(--ink-3);width:17px;height:17px}
.task .btns{display:flex;gap:8px;flex-wrap:wrap}.task .btns .btn{flex:1;min-width:110px}
.phone-link{color:var(--ink);text-decoration:none;text-align:start;font-weight:600}
.date-tile{width:52px;flex:none;border-radius:12px;overflow:hidden;text-align:center;border:1px solid var(--cab-line);background:linear-gradient(180deg,var(--cab-a),var(--cab-b))}
.date-tile b{display:block;font-family:var(--f-led);font-size:22px;color:var(--led);line-height:1.2;padding-top:4px}
.date-tile small{display:block;font-size:10.5px;color:#AEB7C0;padding-bottom:5px}
.date-tile.late b{color:#FF7A6E}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.ph-add{aspect-ratio:1;border:1.5px dashed var(--line);border-radius:10px;display:grid;place-items:center;color:var(--ink-3);cursor:pointer;font-size:12px;text-align:center}
.ph-x{position:absolute;top:4px;inset-inline-start:4px;width:26px;height:26px}

/* chart */
.chart{position:relative}.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .cg{stroke:var(--chart-grid);stroke-width:1}.chart .ct{fill:var(--chart-text)}.chart .cb{stroke:var(--chart-base)}
.chart .cbar{fill:var(--chart-bar)}.chart .cbar.hi{fill:var(--chart-hi)}
html[dir="rtl"] .chart .ct[text-anchor="start"]{text-anchor:end}
.chart .tip{position:absolute;pointer-events:none;background:#1D2228;color:#F2F4F6;font-size:12px;padding:6px 9px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .12s}
.chart .tip.on{opacity:1}

/* weather */
.wx-strip{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(150px,1fr);gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.wx-card{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line-2);box-shadow:var(--shadow);cursor:pointer;font:inherit;color:inherit;text-align:start}
.wx-card b{font-family:var(--f-led);font-size:22px;line-height:1;display:block}
.wx-card span{font-size:12.5px;font-weight:600;display:block}.wx-card small{font-size:11px;color:var(--ink-3)}
.wx-card.hot{border-color:color-mix(in srgb,var(--crit) 40%,transparent);background:var(--crit-soft)}
.wx-card.empty{opacity:.75}.wx-card.empty svg{width:30px;height:30px;color:var(--ink-3)}
.wx-chip{display:inline-flex;align-items:center;gap:3px;font-size:12px;padding:1px 8px 1px 4px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line-2);white-space:nowrap}
.wx-chip b{font-weight:700}.wx-chip small{color:var(--ink-3)}
.wx-chip.hot{background:var(--crit-soft);border-color:color-mix(in srgb,var(--crit) 35%,transparent);color:var(--crit)}
.wx-hero{border-radius:var(--r-lg);padding:18px;color:#EEF1F4;background:radial-gradient(500px 220px at 85% 0%,rgba(255,163,50,.28),transparent 60%),linear-gradient(160deg,#25303C,#141A21);border:1px solid #0E1114;box-shadow:var(--shadow)}
.wx-temp{font-family:var(--f-led);font-size:56px;line-height:1;font-weight:600;color:#fff}
.wx-cond{color:#C9D0D7;font-size:14px;margin-top:4px}
.wx-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px;font-size:13px;color:#C9D0D7}
.wx-meta span{display:flex;align-items:center;gap:6px}.wx-meta b{color:#fff}.wx-meta svg{width:16px;height:16px;color:#8E98A3}
.wx-days{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(84px,1fr);gap:8px;overflow-x:auto;padding-bottom:4px}
.wx-day{position:relative;display:grid;justify-items:center;gap:2px;padding:10px 6px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line-2);font-size:12px}
.wx-day b{font-family:var(--f-led);font-size:18px}.wx-day em{font-style:normal;color:var(--info);font-weight:600}
.wx-day.on{border-color:var(--signal);box-shadow:0 0 0 3px var(--signal-soft)}
.wx-day.hot b{color:var(--crit)}
.dot-off{position:absolute;top:8px;inset-inline-end:8px;width:7px;height:7px;border-radius:50%;background:var(--holi)}

/* calendar */
.cal{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.cal-hd,.cal-g{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-hd div{padding:8px 4px;text-align:center;font-size:12px;font-weight:600;color:var(--ink-3);background:var(--surface-2);border-bottom:1px solid var(--line)}
.cal-hd div.off{color:var(--holi)}
.cal-c{min-height:92px;border-inline-end:1px solid var(--line-2);border-bottom:1px solid var(--line-2);padding:4px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cal-c:nth-child(7n){border-inline-end:0}
.cal-c.pad{background:var(--surface-2)}
.cal-c.off{background:repeating-linear-gradient(135deg,var(--holi-soft) 0 6px,transparent 6px 12px)}
.cal-c.now .cal-d b{background:var(--signal);color:var(--on-signal);border-radius:999px;padding:0 7px}
.cal-d{display:flex;align-items:center;justify-content:space-between;gap:4px;font-size:12px}
.cal-d b{font-family:var(--f-led);font-weight:600}
.cal-h{font-size:9.5px;color:var(--holi);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-v{display:flex;align-items:center;gap:4px;border:0;border-radius:6px;padding:2px 5px;font-size:11px;cursor:pointer;text-align:start;min-width:0;color:var(--ink)}
.cal-v span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-v i{width:7px;height:7px;border-radius:50%;flex:none}
.cal-v.ok{background:var(--ok-soft)}.cal-v.info{background:var(--info-soft)}.cal-v.crit{background:var(--crit-soft)}
@media (max-width:600px){.cal-c{min-height:64px}.cal-v span{display:none}.cal-v{padding:3px;justify-content:center}.cal-h{display:none}}
.cal-legend{display:flex;gap:14px;flex-wrap:wrap;margin:10px 4px;font-size:12px;color:var(--ink-2)}
.cal-legend .lg{display:inline-block;width:12px;height:12px;border-radius:3px;margin-inline-end:5px;vertical-align:-2px}
.lg.ok{background:var(--ok-soft);border:1px solid var(--ok)}.lg.info{background:var(--info-soft);border:1px solid var(--info)}.lg.crit{background:var(--crit-soft);border:1px solid var(--crit)}.lg.off{background:var(--holi-soft);border:1px solid var(--holi)}

/* QR */
.qr-share{display:grid;justify-items:center;gap:10px}
.qr-card{background:#fff;color:#111418;border-radius:18px;padding:16px;display:grid;justify-items:center;gap:8px;box-shadow:0 10px 30px -14px rgba(0,0,0,.5);border:1px solid #E5E9ED}
.qr-card b{font-size:13px;text-align:center}
.qr-mini{display:grid;justify-items:center;gap:4px;background:#fff;color:#111418;border-radius:12px;padding:8px;border:1px solid #E5E9ED}
.qr-mini small{font-size:10.5px;direction:ltr}
.qr-missing{display:grid;place-items:center;background:#F5F7F9;color:#86909B;border-radius:8px;font-weight:700}
.scan-box{position:relative;aspect-ratio:4/3;border-radius:16px;background:#0D1014;overflow:hidden;display:grid;place-items:center;text-align:center;padding:16px}
.scan-box video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scan-box .faint{position:relative;color:#AEB7C0}
.scan-frame{position:absolute;inset:16% 22%;border:3px solid var(--signal);border-radius:16px;box-shadow:0 0 0 999px rgba(0,0,0,.25)}

/* about */
.about-hero{display:flex;align-items:center;gap:14px;padding:14px;border-radius:var(--r-lg);background:linear-gradient(160deg,#25303C,#141A21);color:#EEF1F4;border:1px solid #0E1114}
.about-hero svg.logo{width:78px;height:66px;flex:none}
.about-hero h2{font-family:"Chakra Petch",var(--f-body);font-size:22px;direction:ltr;text-align:start}
.about-hero p{color:#AEB7C0;font-size:13px;margin:2px 0 6px}
.dev-card{margin-top:12px;border-radius:var(--r-lg);padding:16px;border:1px solid color-mix(in srgb,var(--signal) 35%,var(--line));background:linear-gradient(180deg,var(--signal-soft),var(--surface) 70%);display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}
.dev-id{display:flex;gap:12px;align-items:center;min-width:0}
.dev-av{width:58px;height:58px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:"Chakra Petch",sans-serif;font-weight:600;font-size:20px;font-style:normal;color:#fff;background:conic-gradient(from 210deg,#EF8418,#FFC56B,#C96A0B,#EF8418);box-shadow:0 0 0 3px var(--surface),0 0 0 4px color-mix(in srgb,var(--signal) 60%,transparent)}
.dev-id small{color:var(--ink-3);font-size:11.5px;display:block}
.dev-id h3{font-size:19px;margin:1px 0}
.dev-id p{color:var(--ink-2);font-size:12.5px}
.dev-phone{font-family:"Chakra Petch",sans-serif;font-weight:600;font-size:15px;color:var(--signal-strong);text-decoration:none;margin-top:4px}
.dev-qr{display:grid;justify-items:center;gap:4px;background:#fff;border-radius:12px;padding:8px;border:1px solid #E5E9ED;color:#111418}
.dev-qr small{font-size:10px;color:#55606B;max-width:112px;text-align:center}
.dev-acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:460px){.dev-card{grid-template-columns:1fr}.dev-qr{justify-self:start}}
.credit{display:block;margin:16px auto 0;border:0;background:none;color:#8E98A3;font-size:12.5px;cursor:pointer;text-align:center}
.credit b{color:#C9D0D7}

/* map */
.map{position:relative;border-radius:var(--r-lg);overflow:hidden;border:1px solid #0E1114;background:#13222D;display:flex;flex-direction:column}
.map svg{display:block;width:100%;height:auto;order:2}
.map-zoom{order:1;display:flex;gap:6px;padding:10px;overflow-x:auto;background:#1D2228;border-bottom:1px solid #2B323A;scrollbar-width:none}
.map-zoom::-webkit-scrollbar{display:none}
.map-zoom button{flex:none;height:30px;padding:0 11px;border-radius:999px;border:1px solid #3A424B;background:rgba(29,34,40,.86);color:#E7EBEF;font-size:12px;cursor:pointer}
.map-zoom button.on{background:var(--signal);border-color:var(--signal);color:var(--on-signal);font-weight:600}
.map-legend{position:absolute;bottom:10px;inset-inline-end:10px;background:rgba(29,34,40,.86);color:#C9D0D7;border:1px solid #3A424B;border-radius:10px;padding:6px 10px;font-size:11.5px;display:flex;gap:12px}
.map-legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-inline-end:5px;vertical-align:middle}
.tech-chip{display:inline-flex;align-items:center;gap:7px}
.tech-chip i{width:10px;height:10px;border-radius:50%;flex:none}
.av-sm{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;flex:none;font-style:normal}
.av-sm svg{width:18px;height:18px}

/* login + doors */
.login{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(1200px 500px at 50% -10%,#2E363F 0%,#171B20 60%)}
:root[data-scheme="dark"] .login{background:radial-gradient(1200px 500px at 50% -10%,#1D242C 0%,#090B0E 60%)}
.cab{width:100%;max-width:420px}
.login-prefs{display:flex;justify-content:center;margin-bottom:14px}
.login-prefs .seg2{background:#1E242B;border-color:#333C46}.login-prefs .seg2 button{color:#AEB7C0}.login-prefs .seg2 button.on{background:var(--signal);color:var(--on-signal)}
.cab-head{text-align:center;color:#E7EBEF;margin-bottom:18px}
.cab-head svg.logo{width:118px;height:98px}
.cab-head h1{font-family:"Chakra Petch",var(--f-body);font-size:30px;letter-spacing:.5px;margin-top:4px;direction:ltr}
.cab-head p{color:#9EA8B3;font-size:13.5px}
.cab-ind{margin:12px auto 0;width:max-content;max-width:100%;display:flex;align-items:center;gap:10px;padding:6px 14px;border-radius:10px;background:#0F1215;border:1px solid #2B323A}
.cab-ind b{font-family:var(--f-led);color:var(--led);font-size:18px;text-shadow:0 0 10px rgba(255,163,50,.5);direction:ltr}
.cab-ind small{color:#7F8994;font-size:11.5px}
.login .card{padding:18px;border-color:var(--cab-line)}
.role-sw{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:4px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line-2);margin-bottom:14px}
.role-sw button{height:38px;border-radius:999px;border:0;background:none;font-weight:600;color:var(--ink-2);cursor:pointer}
.role-sw button.on{background:var(--cab);color:#fff}
:root[data-scheme="dark"] .role-sw button.on{background:var(--signal);color:var(--on-signal)}

#doors{position:fixed;inset:0;z-index:100;pointer-events:none;display:flex;direction:ltr}
#doors div{flex:1;height:100%;background:repeating-linear-gradient(90deg,rgba(255,255,255,.08) 0 1px,rgba(0,0,0,.05) 1px 3px),linear-gradient(90deg,#9AA3AC,#D7DCE1 45%,#AEB6BE);transition:transform .95s cubic-bezier(.7,0,.25,1);box-shadow:inset 0 0 40px rgba(0,0,0,.25)}
#doors div:first-child{border-right:1px solid #6F7882}#doors div:last-child{border-left:1px solid #6F7882}
#doors.open div:first-child{transform:translateX(-100%)}#doors.open div:last-child{transform:translateX(100%)}
@media (prefers-reduced-motion:reduce){#doors div{transition:none}.scrim,.sheet,.toast{animation:none}}

/* ---------- Documents (always white paper) ---------- */
.doc-preview{background:#5A636D;border-radius:12px;padding:14px;overflow:auto;max-height:70vh}
.doc-scale{transform-origin:top center;margin:0 auto}
html[dir="rtl"] .doc-scale{transform-origin:top right}
html[dir="ltr"] .doc-scale{transform-origin:top left}
.pdf-stage{position:fixed;left:-12000px;top:0;width:794px;z-index:-1}
.page{width:794px;height:1123px;background:#fff;color:#16191D;position:relative;overflow:hidden;margin:0 auto 14px;font-family:var(--f-doc);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.pdf-stage .page{box-shadow:none;margin:0}
.page[lang="en"]{font-family:"IBM Plex Sans Arabic",sans-serif}
.page-in{position:absolute;inset:34px 44px 30px;display:flex;flex-direction:column}
.page .wm{position:absolute;left:50%;top:54%;width:430px;height:360px;transform:translate(-50%,-50%);opacity:.055;pointer-events:none}
.page .wm svg{width:100%;height:100%}
.d-head{display:grid;grid-template-columns:1fr 120px 1fr;align-items:center;gap:10px}
.d-head .ar{text-align:right;font-family:"IBM Plex Sans Arabic",sans-serif;font-size:11.5px;line-height:1.6;color:#2B3036}
.d-head .ar b{font-family:var(--f-display);font-size:19px;color:#16191D;display:block;line-height:1.35}
.d-head .en{text-align:left;direction:ltr;font-family:"IBM Plex Sans Arabic",sans-serif;font-size:11px;line-height:1.6;color:#2B3036}
.d-head .en b{font-size:15px;color:#16191D;display:block;font-weight:700;letter-spacing:.2px}
.d-head svg{width:120px;height:100px;margin:0 auto;display:block}
.d-rule{height:3px;background:#EF8418;margin-top:8px;position:relative}
.d-rule::after{content:"";position:absolute;inset-inline:0;bottom:-4px;height:1px;background:#16191D}
.d-bism{text-align:center;font-size:15px;margin:12px 0 2px;color:#2B3036}
.d-title{display:flex;align-items:center;justify-content:space-between;margin:6px 0 10px}
.d-title h2{font-family:var(--f-display);font-size:28px;color:#16191D;font-weight:700}
.page[lang="en"] .d-title h2{font-family:"IBM Plex Sans Arabic",sans-serif}
.d-title .pg{font-family:"IBM Plex Sans Arabic",sans-serif;font-size:11px;color:#6B747E;border:1px solid #D7DCE1;border-radius:999px;padding:1px 10px;margin-top:4px;display:inline-block}
.d-no{border:1.5px solid #16191D;border-radius:10px;overflow:hidden;font-family:"IBM Plex Sans Arabic",sans-serif;font-size:12px;min-width:200px}
.d-no div{display:flex;justify-content:space-between;gap:14px;padding:4px 12px}
.d-no div+div{border-top:1px solid #D7DCE1}
.d-no b{font-family:var(--f-led);font-size:15px;direction:ltr;color:#C96A0B}
.d-info{display:grid;grid-template-columns:1fr 1fr;border:1px solid #CDD3D9;border-radius:10px;overflow:hidden;font-size:13.5px;margin-bottom:10px}
.d-info div{padding:6px 12px;border-bottom:1px solid #E3E7EB;display:flex;gap:8px}
.d-info div:nth-child(odd){border-inline-end:1px solid #E3E7EB}
.d-info span{color:#6B747E;font-family:"IBM Plex Sans Arabic",sans-serif;font-size:12px;min-width:86px;padding-top:2px}
.d-info b{font-weight:700}
table.d-tbl{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:10px;font-family:"IBM Plex Sans Arabic",sans-serif}
.d-tbl th{background:#1D2228;color:#fff;font-weight:600;padding:6px 8px;text-align:start;font-size:11.5px}
.d-tbl td{padding:6px 8px;border-bottom:1px solid #E3E7EB}
.d-tbl tr:nth-child(even) td{background:#F7F8FA}
.d-p{font-size:var(--dfs,13px);line-height:1.85;text-align:justify;margin-bottom:6px}
.d-parties{font-size:var(--dfs,13px);line-height:1.85;margin-bottom:6px}
ol.d-cl{margin:0;padding:0;list-style:none;counter-reset:cl var(--start,0)}
ol.d-cl li{counter-increment:cl;position:relative;padding-inline-start:28px;font-size:var(--dfs,13px);line-height:1.85;text-align:justify;margin-bottom:4px}
ol.d-cl li::before{content:counter(cl);position:absolute;inset-inline-start:0;top:3px;width:20px;height:20px;border-radius:50%;background:#FFF1E1;color:#C96A0B;font-family:var(--f-led);font-weight:600;font-size:12px;display:grid;place-items:center;line-height:1}
.d-hl{background:#FFF1E1;color:#16191D;padding:0 6px;border-radius:4px;font-weight:700;font-family:"IBM Plex Sans Arabic",sans-serif}

const JSQR_SRC = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';

}
function qrSVG(text, size = 200, opts = {}) {
  const m = qrModules(text);
  if (!m) return `<div class="qr-missing" style="width:${size}px;height:${size}px">QR</div>`;
  const q = 2, N = m.n + q * 2; let d = '';

}
function qrPNG(text, px = 720) {
  const m = qrModules(text); if (!m) return null;

}

/* ================= Automation engine ================= */
function runAutomation() {
  const T = today(), changes = [];
  /* 1) new year → ask for first contract number */
  const yr = parseISO(T).getFullYear();
  if (S.settings.numbering.year < yr) { S.settings.numbering.year = yr; S.settings.numbering.yearSet = false; changes.push('year'); }

  /* 2) contracts */
  S.contracts.forEach(c => {
    c.flags = c.flags || {}; const cl = client(c.clientId); if (!cl) return;
    if (c.status === 'active') {
      const d = daysBetween(T, c.end);
      if (d <= 7 && d > 0 && !c.flags.r7) {
        c.flags.r7 = true;
        notify('contractEnd', 'owner', LL(`العقد ${c.number} ينتهي بعد ${d} ${d <= 10 ? 'أيام' : 'يوماً'}`, `Contract ${c.number} ends in ${d} days`), LL(`${cl.name} · ينتهي في ${fmtDate(c.end)}`, `${cl.name} · ends ${fmtDate(c.end)}`), { view: 'contract', id: c.id }, `n-r7-${c.id}`);
        if (S.settings.autoRenew && !c.renewedById && !S.contracts.some(x => x.prevId === c.id)) {
          const nc = createRenewalDraft(c, true);
          notify('contractEnd', 'owner', LL(`جهّزنا مسودة تجديد رقم ${nc.number}`, `Renewal draft ${nc.number} prepared`), LL(`${cl.name} · راجع السعر الجديد ثم اعتمد العقد`, `${cl.name} · review the new price, then approve`), { view: 'contract', id: nc.id }, `n-ren-${c.id}`);
        }
        changes.push('r7');
      }
      if (d === 0 && !c.flags.r0) { c.flags.r0 = true; notify('contractEnd', 'owner', LL(`العقد ${c.number} ينتهي اليوم`, `Contract ${c.number} ends today`), LL(`${cl.name} · جدّد العقد لضمان استمرار الصيانة`, `${cl.name} · renew to keep maintenance running`), { view: 'contract', id: c.id }, `n-r0-${c.id}`); changes.push('r0'); }
      if (d < 0) { c.status = 'expired'; notify('contractEnd', 'owner', LL(`انتهى العقد ${c.number}`, `Contract ${c.number} expired`), LL(`${cl.name} · توقفت جدولة الصيانة لهذا العقد`, `${cl.name} · maintenance scheduling stopped`), { view: 'contract', id: c.id }, `n-exp-${c.id}`); log(LL(`انتهى العقد ${c.number} تلقائياً`, `Contract ${c.number} expired automatically`), SYS); changes.push('exp'); }
    }
    if (['pending', 'active'].includes(c.status) && balance(c) > 0 && !c.flags.pay20) {
      const from = c.sentAt || c.start;
      if (from && daysBetween(from, T) >= 20) {
        c.flags.pay20 = true;
        notify('payment', 'owner', LL(`لم يكتمل سداد العقد ${c.number}`, `Contract ${c.number} not fully paid`), LL(`${cl.name} · المتبقي ${fmtNum(balance(c))} ر.س · رسالة التذكير جاهزة`, `${cl.name} · ${fmtNum(balance(c))} SAR outstanding · reminder message ready`), { view: 'contract', id: c.id }, `n-pay-${c.id}`);
        changes.push('pay20');
      }
    }
  });

  /* 3) month-start schedule: every building with a running contract, on a working day */
  const mk = monthKey(T); let created = 0;
  S.buildings.forEach(b => {

/* ---------- bar chart (single series, theme-aware) ---------- */
function barChart(data, { h = 230, fmt = v => fmtNum(v), hi = -1 } = {}) {
  const W = 640, padT = 18, padB = 40, padL = 8, padR = 70, FS = 19;
  const max = Math.max(1, ...data.map(d => d.v));
  const nice = (() => { const p = Math.pow(10, Math.floor(Math.log10(max))); const m = max / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p; })();
  const ih = h - padT - padB, iw = W - padL - padR, bw = iw / data.length, gap = Math.max(4, bw * 0.28), y = v => padT + ih - (v / nice) * ih;
  const grid = [0, nice / 2, nice].map(t => `<line class="cg" x1="${padL}" x2="${W - padR}" y1="${y(t)}" y2="${y(t)}"/><text class="ct" x="${W - padR + 8}" y="${y(t) + 6}" font-size="${FS}" text-anchor="start">${t >= 1000 ? fmtNum(t / 1000) + 'k' : fmtNum(t)}</text>`).join('');
  const bars = data.map((d, i) => {
    const x = padL + i * bw + gap / 2, w = bw - gap, yy = y(d.v), hh = padT + ih - yy, r = Math.min(4, w / 2, hh);
    const path = hh <= 0 ? '' : `M${x} ${padT + ih}V${yy + r}Q${x} ${yy} ${x + r} ${yy}H${x + w - r}Q${x + w} ${yy} ${x + w} ${yy + r}V${padT + ih}Z`;
    return `<g><rect x="${padL + i * bw}" y="${padT}" width="${bw}" height="${ih}" fill="transparent" data-tip="${esc(d.l + ': ' + fmt(d.v))}"/>${path ? `<path class="${i === hi ? 'cbar hi' : 'cbar'}" d="${path}" pointer-events="none"/>` : ''}${data.length <= 8 || i % 2 === (data.length - 1) % 2 ? `<text class="ct" x="${x + w / 2}" y="${h - 10}" font-size="${FS}" text-anchor="middle">${esc(d.s || d.l)}</text>` : ''}</g>`;
  }).join('');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${h}" role="img" aria-label="${esc(data.map(d => d.l + ' ' + fmt(d.v)).join(', '))}">${grid}<line class="cb" x1="${padL}" x2="${W - padR}" y1="${padT + ih}" y2="${padT + ih}"/>${bars}</svg><div class="tip"></div></div>`;
}
document.addEventListener('pointerover', e => {
  const r = e.target.closest?.('.chart [data-tip]'); if (!r) return;
  const ch = r.closest('.chart'), tip = ch.querySelector('.tip'), bb = r.getBoundingClientRect(), cb = ch.getBoundingClientRect();
  tip.textContent = r.dataset.tip; tip.classList.add('on'); tip.style.left = (bb.left - cb.left + bb.width / 2) + 'px'; tip.style.top = Math.max(18, bb.top - cb.top + 30) + 'px';
});

/* ---------- file delivery ---------- */
/* Phones only allow sharing right after a tap, and making a PDF takes a few seconds,
   so the finished file is offered in a small sheet: Share (WhatsApp…) and Open (full page). */
async function deliverFile(blob, filename, shareText = '') {
  if (DL) { try { await DL.save({ filename, data: blob }); toast(L('تم تجهيز الملف: ', 'File ready: ') + filename, 'ok'); return true; } catch (e) { if (e && e.code === 'declined') { toast(L('تم إلغاء الحفظ', 'Save cancelled')); return false; } } }
  const file = new File([blob], filename, { type: blob.type || 'application/octet-stream' }), url = URL.createObjectURL(blob);
  const canShare = !!(navigator.canShare && navigator.canShare({ files: [file] })), isPdf = /pdf/.test(blob.type);
  return new Promise(res => {
    const m = openModal({ title: L('الملف جاهز', 'File ready'), body: `<div class="row" style="gap:12px"><span class="lead-ic">${ic(isPdf ? 'file' : 'backup')}</span><div class="grow"><b class="ltr" style="word-break:break-all">${esc(filename)}</b><div class="faint">${Math.max(1, Math.round(blob.size / 1024))} KB</div></div></div>
      <p class="faint" style="margin-top:10px">${canShare ? L('«مشاركة» تفتح قائمة الجوال: اختر واتساب ثم الشخص، أو «حفظ في الملفات».', '“Share” opens the phone’s menu: choose WhatsApp and the person, or Save to Files.') : L('اضغط «فتح» لعرض الملف كاملاً، ثم احفظه أو شاركه من المتصفح.', 'Tap “Open” to see the whole file, then save or share it from the browser.')}</p>`,
      foot: `<a class="btn" href="${url}" target="_blank" rel="noopener" ${canShare ? '' : `download="${esc(filename)}"`} data-x="open">${ic('eye')}${L('فتح', 'Open')}</a>${canShare ? `<button class="btn pri" data-x="share">${ic('share')}${L('مشاركة', 'Share')}</button>` : ''}` });
    m.addEventListener('click', async e => {
      const b = e.target.closest('[data-x]'); if (!b) return;
      if (b.dataset.x === 'open') { setTimeout(() => { closeModal(m); res(true); }, 300); return; }
      try { await navigator.share({ files: [file], text: shareText }); closeModal(m); res(true); }
      catch (err) { if (err && err.name === 'AbortError') return; toast(L('تعذّرت المشاركة؛ اضغط «فتح» بدلاً منها.', 'Sharing didn’t work; tap “Open” instead.'), 'err'); }
    });
    setTimeout(() => URL.revokeObjectURL(url), 10 * 60000);
  });
}

/* building status board: one shaft per lift, floors = stops, car height = status */
function shaftSVG(b, v) {
  const ls = liftsOf(b.id).slice(0, 4), n = Math.max(1, ls.length), W = 116, H = 104, sw = 20, gap = 7;
  const x0 = (W - (n * sw + (n - 1) * gap)) / 2;
  const st = !v ? 'none' : v.status === 'done' ? 'ok' : isOverdue(v) ? 'crit' : v.date === today() ? 'sig' : 'info';
  return `<svg viewBox="0 0 ${W} ${H}" class="shafts" role="img" aria-label="${esc(b.name)}">${ls.map((l, i) => {
    const floors = Math.min(12, l.stops), fh = (H - 12) / floors, x = x0 + i * (sw + gap);
    const lvl = st === 'ok' ? floors - 1 : st === 'crit' ? 0 : st === 'none' ? -1 : Math.floor((floors - 1) / 2);
    const lines = Array.from({ length: floors - 1 }, (_, f) => `<line class="fl" x1="${x + 3}" x2="${x + sw - 3}" y1="${6 + (f + 1) * fh}" y2="${6 + (f + 1) * fh}"/>`).join('');
    const car = lvl < 0 ? '' : `<rect class="car ${st}" x="${x + 2.5}" y="${6 + (floors - 1 - lvl) * fh + 1.5}" width="${sw - 5}" height="${Math.max(4, fh - 3)}" rx="2"/>`;
    return `<rect class="shaft" x="${x}" y="5" width="${sw}" height="${H - 10}" rx="3"/>${lines}${car}`;
  }).join('')}<line class="ground" x1="4" x2="${W - 4}" y1="${H - 4}" y2="${H - 4}"/></svg>`;
}

  const mk = monthKey(today());

}

  S.clients.filter(c => c.name.includes(q) || (c.contact || '').includes(q) || toLatinDigits(c.phone1).includes(q) || toLatinDigits(c.phone2).includes(q)).forEach(c => r.push(`<div class="li" data-act="go-client" data-id="${c.id}" role="button" tabindex="0"><span class="lead-ic">${ic('users')}</span><div class="grow"><div class="t">${esc(c.name)}</div><div class="s ltr">${phoneShow(c.phone1)}</div></div><span class="pill nod">${L('عميل', 'Client')}</span></div>`));
  S.buildings.filter(b => b.name.includes(q) || b.city.includes(q) || cityName(b.city).toLowerCase().includes(q.toLowerCase())).forEach(b => r.push(`<div class="li" data-act="go-building" data-id="${b.id}" role="button" tabindex="0"><span class="lead-ic">${ic('building')}</span><div class="grow"><div class="t">${esc(b.name)}</div><div class="s">${esc(cityName(b.city))}</div></div><span class="pill nod">${L('مبنى', 'Building')}</span></div>`));
  S.contracts.filter(k => String(k.number).includes(q)).forEach(k => r.push(`<div class="li" data-act="open-contract" data-id="${k.id}" role="button" tabindex="0"><span class="lead-ic"><span class="tag-led">${k.number}</span></span><div class="grow"><div class="t">${esc(client(k.clientId)?.name || '')}</div><div class="s">${fmtDate(k.start)} ${arr()} ${fmtDate(k.end)}</div></div>${statusPill(k)}</div>`));

  return r.join('') || empty('search', L('لا نتائج', 'No results'));
}

/* ================= Technician day tracking: where each technician spent his day, while signed in ================= */
/* One record per technician per day. seg = [[fromSec, toSec, lat, lng, accuracyM], …] in seconds after local midnight.
   A point in the same spot only stretches the last entry, so a whole day stays a few KB. */
const TRACK_GAP = 300;                 /* silence longer than 5 min = app closed, phone locked or signed out */
const trackId = (tid, day) => `tr-${tid}-${day}`;
const daySec = (d = new Date()) => d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds();
const distM = (a, b, c, d) => { const R = 6371000, r = Math.PI / 180, dl = (c - a) * r, dn = (d - b) * r, x = Math.sin(dl / 2) ** 2 + Math.cos(a * r) * Math.cos(c * r) * Math.sin(dn / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(x)); };
let trackSavedAt = 0;
function trackPoint(t, lat, lng, acc) {
  if (!t || !S.tracks || lat == null || lng == null) return;
  const day = today(), id = trackId(t.id, day), sec = daySec();
  let tr = S.tracks.find(x => x.id === id);
  if (!tr) { tr = { id, techId: t.id, date: day, seg: [] }; S.tracks.push(tr); }
  const last = tr.seg[tr.seg.length - 1], a = Math.round(Math.min(acc || 50, 999));
  if (last && sec >= last[1] && sec - last[1] <= TRACK_GAP && distM(last[2], last[3], lat, lng) <= Math.max(60, Math.min(150, (a + last[4]) / 2))) {
    last[1] = sec; if (a < last[4]) last[4] = a;
    if (Date.now() - trackSavedAt > 120000) { trackSavedAt = Date.now(); save(); }   /* staying in one spot: save every 2 min */
    return;
  }
  tr.seg.push([sec, sec, +(+lat).toFixed(5), +(+lng).toFixed(5), a]); trackSavedAt = Date.now(); save();
}
function cleanupTracks() {   /* keep two months of history */
  const old = S.tracks.filter(x => x.date < addDays(today(), -62)).slice(0, 15);
  if (old.length) { S.tracks = S.tracks.filter(x => !old.includes(x)); return true; }
  return false;
}

/* ---------- turn the raw entries into a readable day ---------- */
const KIND = () => ({ site: L('في مواقع المشاريع', 'At project sites'), travel: L('في الطريق', 'On the road'), other: L('أماكن أخرى', 'Other places'), off: L('بدون تتبع', 'Not tracked') });
const KIND_HELP = () => ({ site: L('داخل دائرة 150 م من مبنى عميل', 'Within 150 m of a client building'), travel: L('يتحرك بين مكانين', 'Moving between places'), other: L('توقف في مكان ليس مبنى عميل', 'Stopped somewhere that is not a client building'), off: L('التطبيق مغلق أو الجوال مقفل أو لا GPS', 'App closed, phone locked or no GPS') });
function siteAt(lat, lng, acc) {
  let best = null, bd = 1e9;
  S.buildings.forEach(b => { if (b.lat == null || b.lng == null) return; const d = distM(lat, lng, b.lat, b.lng); if (d < bd) { bd = d; best = b; } });
  return best && bd <= Math.min(350, 150 + (acc || 0) / 2) ? best : null;
}
function trackDay(tid, day) {
  const tr = S.tracks.find(x => x.id === trackId(tid, day)); if (!tr || !tr.seg.length) return null;
  const seg = [...tr.seg].sort((a, b) => a[0] - b[0]).map(([a, b, lat, lng, acc]) => ({ a, b, lat, lng, acc, site: siteAt(lat, lng, acc) }));
  const out = [];
  const add = k => {
    const p = out[out.length - 1];
    const same = p && p.kind === k.kind && k.a - p.b <= 60 && (k.kind === 'travel' || k.kind === 'off' || (k.kind === 'site' && p.bid === k.bid) || (k.kind === 'other' && distM(p.lat, p.lng, k.lat, k.lng) < 250));
    if (same) { p.b = Math.max(p.b, k.b); return; }
    if (k.b > k.a || k.kind === 'site') out.push(k);
  };
  seg.forEach((s, i) => {
    if (i) {
      const p = seg[i - 1], gap = s.a - p.b;
      if (gap > TRACK_GAP) add({ kind: 'off', a: p.b, b: s.a });
      else if (gap > 0) {
        if (p.site && s.site && p.site.id === s.site.id) add({ kind: 'site', a: p.b, b: s.a, bid: s.site.id, lat: s.lat, lng: s.lng });
        else add({ kind: 'travel', a: p.b, b: s.a });
      }
    }
    if (s.site) add({ kind: 'site', a: s.a, b: s.b, bid: s.site.id, lat: s.lat, lng: s.lng });
    else if (s.b - s.a < 240) add({ kind: 'travel', a: s.a, b: s.b, lat: s.lat, lng: s.lng });
    else add({ kind: 'other', a: s.a, b: s.b, lat: s.lat, lng: s.lng });
  });
  /* a few seconds of “travel” between two stays at the same building is GPS jitter: join them */
  for (let i = 1; i < out.length - 1; i++) {
    const p = out[i - 1], c = out[i], n = out[i + 1];
    if (c.kind === 'travel' && c.b - c.a < 180 && p.kind === 'site' && n.kind === 'site' && p.bid === n.bid) { p.b = n.b; out.splice(i, 2); i--; }
  }
  const tot = { site: 0, travel: 0, other: 0, off: 0 }, places = {};
  out.forEach(k => {
    const d = Math.max(0, k.b - k.a); tot[k.kind] += d;
    k.name = k.kind === 'site' ? (building(k.bid)?.name || '—') : k.kind === 'other' ? nearestPlace(k.lat, k.lng) : KIND()[k.kind];
    const key = k.kind === 'site' ? 'b:' + k.bid : k.kind === 'other' ? 'o:' + k.name : k.kind;
    (places[key] = places[key] || { kind: k.kind, name: k.name, bid: k.bid, lat: k.lat, lng: k.lng, sec: 0, n: 0 }).sec += d; places[key].n++;
  });
  const first = out[0].a, last = out[out.length - 1].b, isToday = day === today();
  return { blocks: out, tot, places: Object.values(places).sort((a, b) => b.sec - a.sec), first, last, seen: isToday ? daySec() - last : null, isToday };
}
const hm = sec => { const m = Math.round(sec / 60), h = Math.floor(m / 60), r = m % 60; return h ? L(`${h} س ${r ? `${r} د` : ''}`, `${h} h${r ? ` ${r} m` : ''}`).trim() : L(`${r} د`, `${r} min`); };
const hmDigits = sec => { const m = Math.round(sec / 60); return `${Math.floor(m / 60)}:${pad(m % 60)}`; };
const secTime = (day, sec) => { const d = parseISO(day); d.setSeconds(sec); return fmtTime(d.toISOString()); };

  const D = trackDay(UIS.trTech, UIS.trDay); if (!D) return;
  const show = e => {
    const el = e.target.closest('i[data-i]'); if (!el) { tip.hidden = true; return; }
    const k = D.blocks[+el.dataset.i], r = bar.getBoundingClientRect(), x = (e.clientX || r.left + r.width / 2) - r.left;
    tip.innerHTML = `<b>${esc(k.name)}</b><span>${secTime(UIS.trDay, k.a)} – ${secTime(UIS.trDay, k.b)} · ${hm(k.b - k.a)}</span>`;
    tip.hidden = false; tip.style.insetInlineStart = 'auto'; tip.style.left = Math.max(0, Math.min(r.width - tip.offsetWidth, x - tip.offsetWidth / 2)) + 'px';
    $$('#tr-bar i').forEach(i => i.classList.toggle('hl', i === el));
  };
  bar.addEventListener('pointermove', show); bar.addEventListener('pointerdown', show);
  bar.addEventListener('pointerleave', () => { tip.hidden = true; $$('#tr-bar i').forEach(i => i.classList.remove('hl')); });
};

/* ---------- periods: daily (14 days), weekly (12 weeks), monthly (12 months) ---------- */
function periodBuckets(per, anchor) {
  const A = parseISO(anchor), out = [];
  if (per === 'day') for (let i = 13; i >= 0; i--) { const d = new Date(A); d.setDate(d.getDate() - i); const k = isoOf(d); out.push({ key: k, from: k, to: k, label: `${d.getDate()}`, sub: dayShort(d.getDay()), title: fmtDate(k) }); }
  else if (per === 'week') { const ws = new Date(A); ws.setDate(ws.getDate() - ws.getDay()); for (let i = 11; i >= 0; i--) { const a = new Date(ws); a.setDate(a.getDate() - 7 * i); const b = new Date(a); b.setDate(b.getDate() + 6); out.push({ key: isoOf(a), from: isoOf(a), to: isoOf(b), label: `${a.getDate()}/${a.getMonth() + 1}`, sub: '', title: `${fmtDate(isoOf(a))} – ${fmtDate(isoOf(b))}` }); } }
  else for (let i = 11; i >= 0; i--) { const a = new Date(A.getFullYear(), A.getMonth() - i, 1), b = new Date(A.getFullYear(), A.getMonth() - i + 1, 0); out.push({ key: isoOf(a).slice(0, 7), from: isoOf(a), to: isoOf(b), label: monthShort(a.getMonth()), sub: i === 11 || a.getMonth() === 0 ? String(a.getFullYear()) : '', title: `${monthName(a.getMonth())} ${a.getFullYear()}` }); }
  return out;
}
const shiftAnchor = (per, anchor, dir) => { const d = parseISO(anchor); if (per === 'day') d.setDate(d.getDate() + 14 * dir); else if (per === 'week') d.setDate(d.getDate() + 84 * dir); else d.setMonth(d.getMonth() + 12 * dir); const k = isoOf(d); return k > today() ? today() : k; };
function periodBar(ns) {
  const per = UIS[ns + 'Per'] || 'month', anchor = UIS[ns + 'At'] || today(), B = periodBuckets(per, anchor);
  return `<div class="per-bar">${segs(ns + 'Per', [['day', L('يومي', 'Daily')], ['week', L('أسبوعي', 'Weekly')], ['month', L('شهري', 'Monthly')]], per)}
    <div class="row" style="gap:6px"><button class="ibtn" data-act="per-move" data-name="${ns}" data-id="-1" aria-label="${L('السابق', 'Earlier')}">${ic(icBack())}</button><span class="per-range">${fmtDate(B[0].from)} – ${fmtDate(B[B.length - 1].to)}</span><button class="ibtn" data-act="per-move" data-name="${ns}" data-id="1" ${anchor >= today() ? 'disabled' : ''} aria-label="${L('التالي', 'Later')}">${ic(icFwd())}</button></div></div>`;
}
ACT['per-move'] = (d, el) => { const ns = el.dataset.name; UIS[ns + 'At'] = shiftAnchor(UIS[ns + 'Per'] || 'month', UIS[ns + 'At'] || today(), +d); renderView(); };
const periodOf = ns => { const B = periodBuckets(UIS[ns + 'Per'] || 'month', UIS[ns + 'At'] || today()); return { B, from: B[0].from, to: B[B.length - 1].to }; };

/* ---------- charts (one hue, thin bars, value on hover/tap, direct labels) ---------- */
function vChart(B, vals, fmt, tips = []) {
  const max = Math.max(...vals, 0), top = max ? niceTop(max) : 1;
  const short = n => n >= 1e6 ? `${Math.round(n / 1e5) / 10}M` : n >= 1000 ? `${Math.round(n / 100) / 10}k` : fmtNum(Math.round(n * 10) / 10);
  const grid = [1, 0.5].map(f => `<i class="vc-grid" style="bottom:${f * 100}%"><span>${short(top * f)}</span></i>`).join('');
  return `<div class="vchart"><div class="vc-plot">${grid}${B.map((b, i) => `<button class="vc-col" type="button" aria-label="${esc(b.title)}: ${esc(fmt(vals[i]))}"><i class="vc-bar ${vals[i] ? '' : 'zero'}" style="height:${vals[i] ? Math.max(2, vals[i] / top * 100).toFixed(2) : 0}%"></i><span class="vc-tip"><b>${esc(b.title)}</b>${esc(fmt(vals[i]))}${tips[i] ? `<small>${tips[i]}</small>` : ''}</span></button>`).join('')}</div>
    <div class="vc-x">${B.map(b => `<span><b>${esc(b.label)}</b>${b.sub ? `<small>${esc(b.sub)}</small>` : ''}</span>`).join('')}</div></div>`;
}
function niceTop(v) { const p = 10 ** Math.floor(Math.log10(v)), f = v / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; }
function hBars(rows, fmt, opts = {}) {
  if (!rows.length) return empty('chart', opts.empty || L('لا بيانات في هذه الفترة', 'No data in this period'));
  const max = Math.max(...rows.map(r => r.v), 0) || 1;
  return `<div class="tr-bars">${rows.map(r => `<div class="tr-row" ${r.act ? `data-act="${r.act}" data-id="${esc(r.id)}" role="button" tabindex="0"` : ''}><div class="tr-name"><b>${esc(r.name)}</b>${r.sub ? `<small>${r.sub}</small>` : ''}</div><div class="tr-track"><i class="hb" style="width:${r.v ? Math.max(1.5, r.v / max * 100).toFixed(2) : 0}%${r.color ? `;background:${r.color}` : ''}"></i></div><div class="tr-val">${fmt(r.v)}</div></div>`).join('')}</div>`;
}

function ledgerFilter(ns, owner) {
  const { from, to } = periodOf(ns), tid = owner ? UIS.lgTech || '' : U.id, cat = UIS[ns + 'Cat'] || '';
  return S.ledger.filter(e => e.date >= from && e.date <= to && (!tid || e.techId === tid) && (!cat || e.cat === cat)).sort((a, b) => (b.date + (b.time || '')).localeCompare(a.date + (a.time || '')));
}
function ledgerBody(ns, owner) {
  const { B } = periodOf(ns), list = ledgerFilter(ns, owner), taken = list.filter(e => e.type !== 'back'), back = list.filter(e => e.type === 'back');
  const T = sum(taken.map(e => +e.amount || 0)), Bk = sum(back.map(e => +e.amount || 0)), pend = list.filter(e => !e.ok);
  const vals = B.map(b => sum(taken.filter(e => e.date >= b.from && e.date <= b.to).map(e => +e.amount || 0)));
  const tips = B.map(b => { const r = sum(back.filter(e => e.date >= b.from && e.date <= b.to).map(e => +e.amount || 0)), n = taken.filter(e => e.date >= b.from && e.date <= b.to).length; return `${n} ${L('قيد', n === 1 ? 'entry' : 'entries')}${r ? ` · ${L('أُعيد', 'returned')} ${sar(r)}` : ''}`; });
  const byCat = Object.entries(taken.reduce((o, e) => { o[e.cat] = (o[e.cat] || 0) + (+e.amount || 0); return o; }, {})).map(([k, v]) => ({ name: lcatName(k), v, id: k, act: 'lg-cat', sub: `${taken.filter(e => e.cat === k).length} ${L('قيد', 'entries')}` })).sort((a, b) => b.v - a.v);

  const catSel = `<select class="in" data-change="lg-catf" data-name="${ns}" aria-label="${L('الفئة', 'Category')}" style="max-width:220px"><option value="">${L('كل الفئات', 'All categories')}</option>${lcats().map(c => `<option value="${c.k}" ${UIS[ns + 'Cat'] === c.k ? 'selected' : ''}>${esc(L(c.ar, c.en))}</option>`).join('')}</select>`;
  return `${periodBar(ns)}
  <div class="row wrap" style="gap:8px;margin:-4px 0 14px">${owner ? `<select class="in" data-change="lg-tech" aria-label="${L('الفني', 'Technician')}" style="max-width:220px"><option value="">${L('كل الفنيين', 'All technicians')}</option>${S.techs.map(t => `<option value="${t.id}" ${UIS.lgTech === t.id ? 'selected' : ''}>${esc(t.name)}</option>`).join('')}</select>` : ''}${catSel}<span class="grow"></span><button class="btn sm" data-act="lg-csv" data-name="${ns}" data-id="${owner ? 1 : ''}">${ic('down')}${L('تصدير Excel', 'Export to Excel')}</button></div>

  <div class="grid g2">

const dayList = (from, to) => { const out = []; for (let d = from; d <= to && out.length < 400; d = addDays(d, 1)) out.push(d); return out; };
function perfOf(t, from, to) {
  const inR = s => s && s >= from && s <= to;
  const visits = S.visits.filter(v => v.techId === t.id && v.status === 'done' && v.report && inR(String(v.report.doneAt).slice(0, 10)));
  const onTime = visits.filter(v => String(v.report.doneAt).slice(0, 10) <= v.date).length;
  const siteSecs = visits.map(v => {
    if (v.checkIn && v.checkIn.at) { const s = (new Date(v.report.doneAt) - new Date(v.checkIn.at)) / 1000; if (s > 60 && s < 14 * 3600) return s; }
    const D = typeof trackDay === 'function' && trackDay(t.id, String(v.report.doneAt).slice(0, 10)), p = D && D.places.find(x => x.kind === 'site' && x.bid === v.buildingId);
    return p ? p.sec : null;
  }).filter(x => x != null);
  const compl = S.complaints.filter(q => q.techId === t.id && q.status === 'closed' && inR(q.closedAt));
  const fixH = compl.map(q => { const a = new Date(q.assignedAt || q.date + 'T08:00:00'), b = new Date(q.closedTs || q.closedAt + 'T17:00:00'); const h = (b - a) / 3600e3; return h >= 0 ? h : null; }).filter(x => x != null);
  const extras = S.extras.filter(x => x.techId === t.id && inR(x.date)).length;
  let site = 0; if (typeof trackDay === 'function') dayList(from, to).forEach(d => { const D = trackDay(t.id, d); if (D) site += D.tot.site; });
  const money = S.ledger.filter(e => e.techId === t.id && inR(e.date)), taken = sum(money.filter(e => e.type !== 'back').map(e => +e.amount || 0)) - sum(money.filter(e => e.type === 'back').map(e => +e.amount || 0));
  const jobs = visits.length + compl.length + extras;
  return { t, visits: visits.length, onTime: visits.length ? Math.round(onTime / visits.length * 100) : null, avgVisit: siteSecs.length ? sum(siteSecs) / siteSecs.length : null, compl: compl.length, avgFix: fixH.length ? sum(fixH) / fixH.length : null, extras, jobs, site, money: taken, perJob: jobs ? taken / jobs : null, moneyOf: cat => sum(money.filter(e => e.type !== 'back' && e.cat === cat).map(e => +e.amount || 0)) };
}

const MAP = { lng0: 38.6, lng1: 43.2, lat0: 17.7, lat1: 22.1, W: 1000 };
MAP.H = Math.round(MAP.W * (MAP.lat1 - MAP.lat0) / ((MAP.lng1 - MAP.lng0) * Math.cos(20 * Math.PI / 180)));
const proj = (lat, lng) => [(lng - MAP.lng0) / (MAP.lng1 - MAP.lng0) * MAP.W, (MAP.lat1 - lat) / (MAP.lat1 - MAP.lat0) * MAP.H];
const COAST = [[22.1, 39.07], [21.85, 39.1], [21.62, 39.11], [21.48, 39.16], [21.3, 39.2], [21.1, 39.33], [20.85, 39.55], [20.55, 39.85], [20.15, 40.25], [19.85, 40.55], [19.5, 40.85], [19.13, 41.08], [18.75, 41.3], [18.4, 41.45], [18.1, 41.62], [17.7, 41.88]];

const ROAD = [[21.5433, 39.1728], [21.4225, 39.8262], [21.2703, 40.4158], [20.75, 40.95], [20.0129, 41.4677], [19.4, 41.95], [18.75, 42.3], [18.2164, 42.5053], [18.3, 42.7333]];
const MAP_CITIES = [['جدة', 21.5433, 39.1728], ['مكة المكرمة', 21.4225, 39.8262], ['الطائف', 21.2703, 40.4158], ['الباحة', 20.0129, 41.4677], ['أبها', 18.2164, 42.5053], ['خميس مشيط', 18.3, 42.7333]];
const ZONES = {
  all: { t: LL('كل المناطق', 'All regions'), c: [20.0, 40.9], s: 1000 },
  jeddah: { t: LL('جدة', 'Jeddah'), c: [21.565, 39.16], s: 70 },
  makkah: { t: LL('مكة', 'Makkah'), c: [21.41, 39.85], s: 70 },
  taif: { t: LL('الطائف', 'Taif'), c: [21.28, 40.42], s: 70 },
  baha: { t: LL('الباحة', 'Al Baha'), c: [20.02, 41.46], s: 70 },
  asir: { t: LL('أبها وخميس', 'Abha & Khamis'), c: [18.26, 42.62], s: 110 },
};
const kmBetween = (a, b, c, d) => { const R = 6371, dl = (c - a) * Math.PI / 180, dn = (d - b) * Math.PI / 180, x = Math.sin(dl / 2) ** 2 + Math.cos(a * Math.PI / 180) * Math.cos(c * Math.PI / 180) * Math.sin(dn / 2) ** 2; return Math.round(R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x)) * 10) / 10; };
function nearestPlace(lat, lng) {
  let best = null, bd = 1e9;
  S.buildings.forEach(b => { const d = kmBetween(lat, lng, b.lat, b.lng); if (d < bd) { bd = d; best = b; } });
  if (best && bd < 0.4) return L(`عند ${best.name}`, `At ${best.name}`);
  if (best && bd < 3) return L(`قرب ${best.name} (${bd} كم)`, `Near ${best.name} (${bd} km)`);
  let cc = null, cd = 1e9; MAP_CITIES.forEach(([n, a, o]) => { const d = kmBetween(lat, lng, a, o); if (d < cd) { cd = d; cc = n; } });
  return cd < 25 ? L(`داخل ${cc}`, `In ${cityName(cc)}`) : L(`على بعد ${Math.round(cd)} كم من ${cc}`, `${Math.round(cd)} km from ${cityName(cc)}`);
}
function nearestZone(lat, lng) { let z = 'all', d = 1e9; Object.entries(ZONES).forEach(([k, v]) => { if (k === 'all') return; const x = kmBetween(lat, lng, v.c[0], v.c[1]); if (x < d) { d = x; z = k; } }); return d < 40 ? z : 'all'; }

function mapSVG({ zoom = 'all', focus = null, span = 0.15, buildings = [], techs = [], trailOf = null, height = 420, zoomBar = false }) {
  const ar = MAP.H / MAP.W;
  let cx, cy, s;
  if (focus) { [cx, cy] = proj(focus[0], focus[1]); s = span / (MAP.lng1 - MAP.lng0) * MAP.W; }
  else { const z = ZONES[zoom] || ZONES.all; [cx, cy] = proj(z.c[0], z.c[1]); s = z.s; }
  const vw = s, vh = s * (focus ? 0.62 : zoom === 'all' ? ar : 0.75);
  const vb = [cx - vw / 2, cy - vh / 2, vw, vh];
  const px = Math.max(300, Math.min((window.innerWidth || 400) - 32, window.innerWidth >= 960 ? 620 : 680));
  const k = vw / px;                                    // map units per screen pixel: marks keep their size at any zoom
  const RM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  const land = pts(COAST) + ` ${proj(17.7, 43.2).join(',')} ${proj(22.1, 43.2).join(',')}`;
  const showLabels = s <= 140 || !!focus;
  const city = MAP_CITIES.map(([n, a, o]) => { const [x, y] = proj(a, o); return `<g><circle cx="${x}" cy="${y}" r="${4.5 * k}" fill="#C9D0D7"/><text x="${x + 9 * k}" y="${y - 7 * k}" font-size="${13 * k}" fill="#C9D0D7" font-family="IBM Plex Sans Arabic, Tahoma" text-anchor="start" style="paint-order:stroke" stroke="#1B2128" stroke-width="${3 * k}">${esc(cityName(n))}</text></g>`; }).join('');
  const bmarks = buildings.map(b => { const [x, y] = proj(b.lat, b.lng); const z = 7 * k; return `<g><rect x="${x - z}" y="${y - z}" width="${z * 2}" height="${z * 2}" rx="${2 * k}" fill="#1B2128" stroke="#EF8418" stroke-width="${2.2 * k}"/><rect x="${x - z * 0.4}" y="${y - z * 0.4}" width="${z * 0.8}" height="${z * 0.8}" fill="#EF8418"/>${showLabels || focus ? `<text x="${x}" y="${y + 21 * k}" font-size="${12 * k}" fill="#FFD9AE" text-anchor="middle" font-family="IBM Plex Sans Arabic, Tahoma" style="paint-order:stroke" stroke="#1B2128" stroke-width="${3 * k}">${esc(b.name)}</text>` : ''}</g>`; }).join('');
  const trail = trailOf && tech(trailOf) ? (() => { const t = tech(trailOf); const p = [...t.trail, t.loc].filter(Boolean); return `<polyline points="${p.map(q => proj(q.lat, q.lng).join(',')).join(' ')}" fill="none" stroke="${t.color}" stroke-width="${2.5 * k}" stroke-dasharray="${6 * k} ${4 * k}" opacity=".9"/>${t.trail.map(q => { const [x, y] = proj(q.lat, q.lng); return `<circle cx="${x}" cy="${y}" r="${3.2 * k}" fill="${t.color}"><title>${fmtTime(q.at)}</title></circle>`; }).join('')}`; })() : '';
  const tmarks = techs.filter(t => t.loc).map(t => {
    const [x, y] = proj(t.loc.lat, t.loc.lng), fresh = Date.now() - new Date(t.loc.at) < 10 * 60000, r = 11 * k;

      <circle cx="${x}" cy="${y}" r="${r}" fill="${t.color}" stroke="#fff" stroke-width="${2.5 * k}"/><text x="${x}" y="${y + 4 * k}" font-size="${10.5 * k}" font-weight="700" fill="#fff" text-anchor="middle" font-family="IBM Plex Sans Arabic, Tahoma">${esc(initials(t.name))}</text>
      ${showLabels ? `<text x="${x}" y="${y - 16 * k}" font-size="${12 * k}" fill="#fff" text-anchor="middle" font-family="IBM Plex Sans Arabic, Tahoma" style="paint-order:stroke" stroke="#1B2128" stroke-width="${3 * k}">${esc(t.name.split(' ')[0])} · ${ago(t.loc.at)}</text>` : ''}</g>`;
  }).join('');
  const svg = `<svg viewBox="${vb.map(n => n.toFixed(1)).join(' ')}" role="img" aria-label="${L('خريطة المواقع', 'Location map')}" style="max-height:${height}px;width:100%;background:#13222D">
    <defs><pattern id="seaP" width="${14 * k}" height="${14 * k}" patternUnits="userSpaceOnUse"><path d="M0 ${7 * k}h${14 * k}" stroke="#1A2E3B" stroke-width="${1 * k}"/></pattern></defs>
    <rect x="${vb[0] - 50}" y="${vb[1] - 50}" width="${vb[2] + 100}" height="${vb[3] + 100}" fill="url(#seaP)"/>
    <polygon points="${land}" fill="#242B33" stroke="#4A545F" stroke-width="${1.5 * k}"/>
    <polyline points="${pts(RIDGE)}" fill="none" stroke="#2F3740" stroke-width="${38 * k}" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
    <polyline points="${pts(ROAD)}" fill="none" stroke="#5C6773" stroke-width="${2.4 * k}" stroke-linejoin="round"/>
    ${s >= 500 ? `<text x="${proj(19.6, 39.5)[0]}" y="${proj(19.6, 39.5)[1]}" font-size="${18 * k}" fill="#3F6175" font-family="IBM Plex Sans Arabic, Tahoma" text-anchor="middle">${L('البحر الأحمر', 'Red Sea')}</text>` : ''}
    ${city}${trail}${bmarks}${tmarks}</svg>`;
  const bar = zoomBar ? `<div class="map-zoom">${Object.entries(ZONES).map(([key, z]) => `<button class="${zoom === key ? 'on' : ''}" data-act="map-zoom" data-id="${key}">${tx(z.t)}</button>`).join('')}</div>` : '';
  const legend = `<div class="map-legend"><span><i style="background:#EF8418"></i>${L('مبنى', 'Building')}</span>${techs.length ? `<span><i style="background:#2F6FDB;border-radius:50%"></i>${L('فني', 'Technician')}</span>` : ''}</div>`;
  return svg + bar + legend;
}

  if (!/^[a-z0-9._-]{3,30}$/.test(d.username)) return toast(L('اسم المستخدم: 3 أحرف إنجليزية أو أرقام على الأقل، بدون مسافات', 'Username: at least 3 English letters or digits, no spaces'), 'err');
  if (!validSaudiMobile(d.phone)) return toast(L('رقم الجوال: 10 أرقام تبدأ بـ 05', 'Mobile: 10 digits starting with 05'), 'err');
  const prev = d.id ? tech(d.id) : null;
  if ((!prev || prev.username !== d.username) && (S.techs.some(t => t.username === d.username && t.id !== d.id) || (await FB.fs.doc('logins/' + d.username).get()).exists)) return toast(L('اسم المستخدم مستخدم من قبل', 'Username already taken'), 'err');
  const lock = () => f.querySelectorAll('input,button').forEach(i => { i.disabled = true; }), sb = $('.sheet-f button[type=submit]'); lock(); sb && sb.classList.add('busy');
  try {
    if (prev) {
      if (prev.username !== d.username && prev.uid) {
        const old = await FB.fs.doc('logins/' + prev.username).get(), b = FB.fs.batch();
        if (old.exists) { b.set(FB.fs.doc('logins/' + d.username), old.data()); b.delete(FB.fs.doc('logins/' + prev.username)); }
        b.update(FB.fs.doc('members/' + prev.uid), { username: d.username }); await b.commit();
      }
      Object.assign(prev, { name: d.name, phone: d.phone, username: d.username, email: d.email });
      log(LL(`تعديل حساب الفني ${d.name}`, `Edited technician ${d.name}`)); saveNow(); closeModal(); toast(L('تم حفظ الحساب', 'Account saved'), 'ok'); return renderView();
    }
    if (String(d.password).length < PASS_MIN) throw { code: 'auth/weak-password' };
    const COLORS = ['#EF8418', '#2F6FDB', '#1E9E5A', '#9B4DCA', '#D23F7A', '#0E8C8C', '#7A5C2E', '#5262D6'];
    const t = { id: uid('t'), name: d.name, phone: d.phone, email: d.email, username: d.username, uid: null, active: true, color: COLORS[S.techs.length % COLORS.length], consent: false, loc: null, trail: [], createdAt: today() };
    await createTechLogin(t, d.password);
    S.techs.push(t); log(LL(`إنشاء حساب فني: ${d.name}`, `Created technician: ${d.name}`)); saveNow(); closeModal(); renderView();
    accessSheet(t, d.password, true);
  } catch (e) { console.error(e); toast(fbErrText(e), 'err'); f.querySelectorAll('input,button').forEach(i => { i.disabled = false; }); sb && sb.classList.remove('busy'); }
};

/* ---------- Firebase rules: kept in the app so the owner can copy them in one tap ---------- */
const RULES_VERSION = 2;
const RULES_TEXT = "rules_version = '2';\nservice cloud.firestore {\n  match /databases/{database}/documents {\n    function signedIn() { return request.auth != null; }\n    function memberPath() { return /databases/$(database)/documents/members/$(request.auth.uid); }\n    function isMember() { return signedIn() && exists(memberPath()) && get(memberPath()).data.active == true; }\n    function isOwner() { return isMember() && get(memberPath()).data.role == 'owner'; }\n    function noOwnerYet() { return !exists(/databases/$(database)/documents/app/owner); }\n    function claimsOwner() { return signedIn() && noOwnerYet() && getAfter(/databases/$(database)/documents/app/owner).data.uid == request.auth.uid; }\n    match /app/owner {\n      allow read: if true;\n      allow create: if signedIn() && noOwnerYet() && request.resource.data.uid == request.auth.uid;\n    }\n    match /app/{doc} {\n      allow read, write: if doc != 'owner' && isMember();\n    }\n    match /logins/{username} {\n      allow read: if true;\n      allow write: if isOwner();\n    }\n    match /members/{uid} {\n      allow read: if signedIn() && (request.auth.uid == uid || isOwner());\n      allow create: if isOwner() || (request.auth.uid == uid && request.resource.data.role == 'owner' && claimsOwner());\n      allow update, delete: if isOwner();\n    }\n    match /data/users/{uid}/{rest=**} {\n      allow read, write: if signedIn() && request.auth.uid == uid;\n    }\n    match /public/{doc} {\n      allow read: if true;\n      allow write: if isOwner();\n    }\n    match /requests/{id} {\n      allow create: if request.resource.data.keys().hasOnly(['name', 'phone', 'email', 'city', 'building', 'kind', 'lifts', 'message', 'at', 'lang'])\n        && request.resource.data.name is string && request.resource.data.name.size() > 1 && request.resource.data.name.size() < 100\n        && request.resource.data.phone is string && request.resource.data.phone.size() > 6 && request.resource.data.phone.size() < 25\n        && (!('message' in request.resource.data) || (request.resource.data.message is string && request.resource.data.message.size() < 1000));\n      allow read, update, delete: if isMember();\n    }\n    match /sessions/{sid} {\n      allow read: if isOwner() || (signedIn() && (resource == null || resource.data.uid == request.auth.uid));\n      allow create: if signedIn() && request.resource.data.uid == request.auth.uid && sid.matches(request.auth.uid + '_[A-Z0-9]+');\n      allow update: if isOwner() || (signedIn() && resource.data.uid == request.auth.uid && request.resource.data.uid == request.auth.uid);\n      allow delete: if isOwner();\n    }\n    match /attempts/{id} {\n      allow create: if request.resource.data.keys().hasOnly(['u', 'role', 'dev', 'model', 'at', 'why', 'city'])\n        && request.resource.data.u is string && request.resource.data.u.size() < 80\n        && request.resource.data.model is string && request.resource.data.model.size() < 100\n        && request.resource.data.dev is string && request.resource.data.dev.size() < 20;\n      allow read, delete: if isOwner();\n    }\n    match /ledger/{id} {\n      function myTech() { return get(memberPath()).data.techId; }\n      allow read: if isOwner() || (isMember() && resource.data.techId == myTech());\n      allow create: if isOwner() || (isMember() && request.resource.data.techId == myTech() && request.resource.data.by == 'tech' && request.resource.data.ok == false);\n      allow update: if isOwner() || (isMember() && resource.data.techId == myTech() && resource.data.ok == false && request.resource.data.techId == myTech() && request.resource.data.ok == false);\n      allow delete: if isOwner() || (isMember() && resource.data.techId == myTech() && resource.data.ok == false);\n    }\n    match /{col}/{id} {\n      allow read, write: if isMember() && !(col in ['app', 'logins', 'members', 'public', 'requests', 'data', 'sessions', 'attempts', 'ledger']);\n    }\n  }\n}\n";
let rulesOk = null;
async function checkRules() {
  const was = rulesOk;
  try { await withTimeout(FB.fs.doc('public/profile').get(), 12000); rulesOk = true; } catch (e) { rulesOk = !/permission/i.test(String(e && (e.code || e.message))); }
  /* newest rules keep sign-in records private to the owner: a write that only the old rules allow means the rules are old */
  if (rulesOk && FB.member?.role === 'owner' && navigator.onLine !== false) {
    const probe = FB.fs.doc('sessions/zz-rulecheck_A0');
    try { await withTimeout(probe.set({ uid: 'zz-rulecheck' }), 10000); rulesOk = false; probe.delete().catch(() => {}); } catch (e) { if (!/permission/i.test(String(e && (e.code || e.message)))) rulesOk = was; }
  }
  if (was === false && rulesOk) {   /* the owner just published the new rules: reopen so every list connects again */
    toast(L('تم تحديث القواعد. جارٍ إعادة الفتح…', 'Rules updated. Reopening…'), 'ok'); setTimeout(() => location.reload(), 1500); return;
  }
  if (rulesOk === false) setTimeout(checkRules, 15000);
  if (U && ['growth', 'profile', 'leads', 'settings'].includes(R.view) && !$('.scrim')) renderView();
}
function rulesBanner() {
  if (rulesOk !== false) return '';
  return `<div class="banner crit"><span class="act-ic crit">${ic('shield')}</span><div class="grow"><b>${L('حدّث قواعد Firebase (دقيقة واحدة)', 'Update the Firebase rules (one minute)')}</b><small>${L('الميزات الجديدة (العملاء المحتملون، العروض، الملف العام) تحتاج القواعد الجديدة. انسخها والصقها في Firestore Database ← Rules ثم Publish.', 'The new features (leads, quotations, public profile) need the new rules. Copy them, paste in Firestore Database → Rules, then Publish.')}</small></div><button class="btn sm pri" data-act="rules-copy">${ic('copy')}${L('نسخ القواعد', 'Copy rules')}</button></div>`;
}
ACT['rules-copy'] = async () => {
  try { await navigator.clipboard.writeText(RULES_TEXT); toast(L('تم نسخ القواعد. الصقها في Firebase ← Firestore ← Rules ثم Publish.', 'Rules copied. Paste them in Firebase → Firestore → Rules, then Publish.'), 'ok'); }

};

  if (os === 'Mac' && safari) return [L('في Safari افتح قائمة «ملف»', 'In Safari open the File menu'), L('اختر «إضافة إلى Dock»', 'Choose “Add to Dock”'), L('يظهر Awais Lift في Dock ويفتح في نافذة خاصة', 'Awais Lift appears in the Dock and opens in its own window')];
  if (edge) return [L('في Edge اضغط … أعلى اليمين', 'In Edge click … at the top right'), L('التطبيقات ← «تثبيت هذا الموقع كتطبيق»', 'Apps → “Install this site as an app”'), L('يظهر في قائمة ابدأ وشريط المهام', 'It appears in the Start menu and taskbar')];
  return [L('افتح الرابط في Google Chrome أو Microsoft Edge', 'Open the link in Google Chrome or Microsoft Edge'), L('اضغط أيقونة التثبيت ⊕ في شريط العنوان، أو ⋮ ← «حفظ ومشاركة» ← «تثبيت الصفحة كتطبيق»', 'Click the install icon ⊕ in the address bar, or ⋮ → “Cast, save and share” → “Install page as app”'), L('يفتح في نافذة خاصة مع أيقونة على سطح المكتب', 'It opens in its own window with a desktop icon')];
}
ACT['install-app'] = async () => {
  if (installEvt) { installEvt.prompt(); try { const r = await installEvt.userChoice; if (r.outcome === 'accepted') installEvt = null; } catch (e) {} return; }
  openModal({ title: L('تثبيت Awais Lift كتطبيق', 'Install Awais Lift as an app'), body: `<div class="howto">${installSteps().map((t, i) => `<div class="howto-row"><b>${i + 1}</b><span>${t}</span></div>`).join('')}</div><p class="faint" style="margin-top:12px">${L('نفس الحساب ونفس البيانات على الجوال والكمبيوتر، ويعمل بدون إنترنت بعد أول فتح.', 'Same account and same data on phone and computer, and it works offline after the first opening.')}</p>` });
};
function installCard() {
  if (isInstalled()) return `<div class="set-row" style="border:0;padding:0"><span class="act-ic ok">${ic('check')}</span><div class="grow"><b>${L('أنت تستخدم التطبيق المثبّت', 'You are using the installed app')}</b><small>${devModel().label}</small></div></div>`;
  return `<div class="set-row" style="border:0;padding:0"><span class="act-ic info">${ic('monitor')}</span><div class="grow"><b>${L('ثبّته على الكمبيوتر والجوال', 'Install it on your computer and phone')}</b><small>${L('أيقونة على سطح المكتب أو الشاشة الرئيسية، نافذة خاصة، ويفتح بدون إنترنت.', 'An icon on the desktop or home screen, its own window, and it opens without internet.')}</small></div><button class="btn sm pri" data-act="install-app">${ic('down')}${L('تثبيت', 'Install')}</button></div>`;
}

/* a technician's sync listens only to his own money entries (the rules refuse anything else) */
function syncColRef(col) {
  if (col !== 'ledger' || !FB.member || FB.member.role === 'owner') return null;
  const q = FB.fs.collection('ledger').where('techId', '==', FB.member.techId || '-');
  return { path: 'ledger', onSnapshot: (next, error) => q.onSnapshot({ includeMetadataChanges: true }, next, fbListenErr(error)) };
}

</script>
